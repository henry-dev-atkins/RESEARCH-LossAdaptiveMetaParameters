[project]
name = "loss-adaptive-meta-parameters"
version = "0.1.0"
description = "Reproducible experiments for loss-driven learning-rate and batch-size control"
requires-python = ">=3.10,<3.14"
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
    "torch>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4",
]

[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

